<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="scoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173C32" />
      <stop offset="100%" stop-color="#23836B" />
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B50" />
      <stop offset="100%" stop-color="#F5EBD8" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#scoutGrad)" stroke="#E89B50" stroke-width="12" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F5EBD8" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Compass Star (Scout Fleur-de-lis / Compass Rose) -->
  <!-- North pointer -->
  <polygon points="256,76 286,226 256,256" fill="#E89B50" />
  <polygon points="256,76 226,226 256,256" fill="#D4863A" />
  
  <!-- South pointer -->
  <polygon points="256,436 286,286 256,256" fill="#F5EBD8" opacity="0.9"/>
  <polygon points="256,436 226,286 256,256" fill="#E2D4BF" />
  
  <!-- East pointer -->
  <polygon points="436,256 286,286 256,256" fill="#E89B50" opacity="0.8"/>
  <polygon points="436,256 286,226 256,256" fill="#D4863A" opacity="0.9"/>
  
  <!-- West pointer -->
  <polygon points="76,256 226,286 256,256" fill="#F5EBD8" opacity="0.9"/>
  <polygon points="76,256 226,226 256,256" fill="#E2D4BF" />

  <!-- Center Knot Emblem -->
  <circle cx="256" cy="256" r="42" fill="#173C32" stroke="#E89B50" stroke-width="6"/>
  <circle cx="256" cy="256" r="16" fill="#E89B50" />
</svg>
